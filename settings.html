<div
  id="scene-state-extension_settings"
  class="scene-state-extension_settings"
>
  <div class="scene-state-extension_row">
    <label class="checkbox_label" for="scene-state-extension_enabled">
      <input id="scene-state-extension_enabled" type="checkbox" />
      <span>Enabled</span>
    </label>
  </div>

  <div class="scene-state-extension_row">
    <label for="scene-state-extension_analysis_mode">Analysis mode</label>
    <select id="scene-state-extension_analysis_mode">
      <option value="last_message">Last message</option>
      <option value="recent_window">Recent window</option>
    </select>
  </div>

  <div class="scene-state-extension_row">
    <label for="scene-state-extension_window_size">Window size</label>
    <input
      id="scene-state-extension_window_size"
      type="number"
      min="1"
      step="1"
    />
  </div>

  <div class="scene-state-extension_row">
    <label class="checkbox_label" for="scene-state-extension_debug_mode">
      <input id="scene-state-extension_debug_mode" type="checkbox" />
      <span>Debug mode</span>
    </label>
  </div>
</div>
